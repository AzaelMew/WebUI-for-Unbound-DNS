<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unbound WebUI — initial setup</title><link rel="stylesheet" href="/static/css/login-page.css"></head><body><main style="max-width:440px;margin:10vh auto;padding:24px;color:#eee;background:#16191e;border-radius:12px;font-family:sans-serif;"><h1>Unbound WebUI setup</h1><p>Create the admin password. This one-time setup is restricted to your PC.</p><form action="/setup" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="username">Username</label><input style="display:block;width:90%;padding:12px;margin:10px 0" id="username" name="username" autocomplete="username" value="admin" readonly><label for="password">Password (12–128 characters)</label><input style="display:block;width:90%;padding:12px;margin:10px 0" id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="submit" style="padding:12px">Create administrator</button></form><p>DNS settings are not changed by setup.</p></main></body></html>
